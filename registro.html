<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strydr | Registro</title>
    <link rel="stylesheet" href="assets/css/styles.css">

</head>


<body>

    <header class="navbar">
        <div class="logo">STRYDR<span>.</span></div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html" class="btn-login">Iniciar sesión</a>
        </nav>
    </header>

    <main class="container">
        <div class="auth-card">
            <section class="page-header" style="margin-bottom: 1.5rem;">
                <h2>Crea tu cuenta</h2>
                <p class="subtitle">Únete a la comunidad Strydr y sigue tus metas deportivas.</p>
            </section>

            <form id="registerForm">
                <div class="form-group">
                    <label for="r-name">Nombre completo</label>
                    <input type="text" id="r-name" placeholder="Ej. Brayan Camarillo" required>
                </div>
                <div class="form-group">
                    <label for="r-email">Correo electrónico</label>
                    <input type="email" id="r-email" placeholder="usuario@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="r-pass">Contraseña</label>
                    <input type="password" id="r-pass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary w-full">Registrarme</button>
            </form>

            <div id="registerStatus" class="alert success hidden">
                ¡Registro exitoso (simulado)! Redirigiendo al inicio de sesión...
            </div>

            <p class="auth-switch">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Strydr Inc. Todos los derechos reservados.</p>
    </footer>

    <script>
        const form = document.getElementById('registerForm');
        const statusBox = document.getElementById('registerStatus');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            statusBox.classList.remove('hidden');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });
    </script>
</body>

</html>
