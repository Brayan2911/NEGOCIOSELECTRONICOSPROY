<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strydr | Registro</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">STRYDR<span>.</span></div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="carrito.html">Carrito <span class="cart-badge" id="cartCount">2</span></a>
            <a href="perfil.html" class="btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Mi
                Perfil</a>
            <a href="admin.html" style="font-size: 0.85rem; opacity: 0.8;">Admin</a>
        </nav>
    </header>

    <main class="container">
        <div class="auth-card">
            <section class="page-header" style="margin-bottom: 1.5rem;">
                <h2>Crea tu cuenta</h2>
                <p class="subtitle">Únete a la comunidad Strydr y sigue tus metas deportivas.</p>
            </section>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="r-name">Nombre completo</label>
                    <input type="text" id="r-name" placeholder="Ej. Brayan Camarillo">
                </div>
                <div class="form-group">
                    <label for="r-email">Correo electrónico</label>
                    <input type="text" id="r-email" placeholder="usuario@correo.com">
                </div>
                <div class="form-group">
                    <label for="r-pass">Contraseña</label>
                    <input type="password" id="r-pass" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary w-full">Registrarme</button>
            </form>

            <div id="registerStatus" class="alert success hidden">
                ¡Registro exitoso! Redirigiendo al inicio de sesión...
            </div>

            <p class="auth-switch">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Strydr Inc. Todos los derechos reservados.</p>
    </footer>

    <script>
        const form = document.getElementById('registerForm');
        const statusBox = document.getElementById('registerStatus');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            statusBox.classList.remove('hidden');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1200);
        });
    </script>
</body>

</html>
