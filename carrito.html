<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strydr | Carrito y Pago</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">STRYDR<span>.PAGO</span></div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="campana.html">Campañas & Promos</a>
            <a href="publicar.html">Vender (C2C)</a>
            <a href="subasta.html">Subasta</a>
            <a href="carrito.html" class="active">Carrito <span class="cart-badge" id="cartCount">0</span></a>
            <a href="perfil.html" id="profileNavLink" class="btn-secondary"
                style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Mi Perfil</a>
            <a href="admin.html" id="adminNavLink" style="font-size: 0.85rem; opacity: 0.8; display: none;">Admin</a>
        </nav>
    </header>

    <main class="container" style="padding-bottom: 4rem;">
        <section class="page-header">
            <h2>Carrito de Compras y Pasarela de Pago</h2>
            <p class="subtitle">Selecciona tu método de pago, completa los datos y genera tu factura digital
                instantánea.</p>
        </section>

        <!-- CONTENEDOR PRINCIPAL DEL CARRITO / PAGO / TICKET -->
        <div id="checkoutContainer"></div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Strydr Inc. Todos los derechos reservados.</p>
    </footer>

    <script>
        function renderCheckout() {
            const cart = JSON.parse(localStorage.getItem('strydr_cart')) || [];
            const container = document.getElementById('checkoutContainer');
            const cartCountBadge = document.getElementById('cartCount');

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (cartCountBadge) cartCountBadge.textContent = totalItems;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 3rem 1rem;">
                        <p style="font-size: 1.2rem; color: #666;">Tu carrito está vacío.</p>
                        <a href="catalogo.html" class="btn-primary" style="display: inline-block; margin-top: 1rem; text-decoration: none;">Explorar Catálogo</a>
                    </div>
                `;
                return;
            }

            let subtotal = 0;
            let rowsHtml = cart.map((item, index) => {
                const itemSubtotal = item.price * item.quantity;
                subtotal += itemSubtotal;
                return `
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 1rem;"><strong>${item.name}</strong><br><small style="color:#777;">${item.category || 'Deportivo'}</small></td>
                        <td style="padding: 1rem;">$${item.price.toLocaleString()} MXN</td>
                        <td style="padding: 1rem;">
                            <input type="number" value="${item.quantity}" min="1" max="10" onchange="updateQuantity(${index}, this.value)" style="width: 60px; padding: 0.3rem; border: 1px solid #ccc; border-radius: 4px;">
                        </td>
                        <td style="padding: 1rem;">$${itemSubtotal.toLocaleString()} MXN</td>
                        <td style="padding: 1rem;">
                            <button onclick="removeItem(${index})" style="background: none; border: none; color: #e74c3c; cursor: pointer; font-weight: bold;">Eliminar</button>
                        </td>
                    </tr>
                `;
            }).join('');

            const savedDiscountPct = parseFloat(localStorage.getItem('strydr_discount')) || 0;
            const discountAmount = (subtotal * savedDiscountPct) / 100;
            const finalTotal = Math.max(0, subtotal - discountAmount);

            container.innerHTML = `
                <div style="overflow-x: auto; margin-bottom: 2rem;">
                    <table style="width: 100%; border-collapse: collapse; background: white; border-radius: 8px; border: 1px solid #eee;">
                        <thead>
                            <tr style="border-bottom: 2px solid #ddd; text-align: left; background: #fafafa;">
                                <th style="padding: 0.75rem;">Producto</th>
                                <th style="padding: 0.75rem;">Precio</th>
                                <th style="padding: 0.75rem;">Cantidad</th>
                                <th style="padding: 0.75rem;">Subtotal</th>
                                <th style="padding: 0.75rem;">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>

                <div style="display: flex; gap: 2rem; flex-wrap: wrap; justify-content: space-between; align-items: flex-start;">
                    
                    <!-- FORMULARIO DE MÉTODOS DE PAGO -->
                    <div style="background: #f9f9f9; padding: 1.5rem; border-radius: 8px; flex: 1; min-width: 300px; border: 1px solid #ddd;">
                        <h3>💳 Selecciona Método de Pago</h3>
                        
                        <div style="margin: 1rem 0; display: flex; gap: 1rem;">
                            <label style="cursor: pointer;"><input type="radio" name="paymentMethod" value="Tarjeta" checked onclick="togglePaymentFields('card')"> Tarjeta</label>
                            <label style="cursor: pointer;"><input type="radio" name="paymentMethod" value="PayPal" onclick="togglePaymentFields('paypal')"> PayPal</label>
                            <label style="cursor: pointer;"><input type="radio" name="paymentMethod" value="OXXO" onclick="togglePaymentFields('oxxo')"> OXXO Pay</label>
                        </div>

                        <div id="paymentFormFields" style="background: white; padding: 1rem; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 1.5rem;">
                            <!-- Dinámico según método -->
                        </div>

                        <div style="background: #fff; padding: 1rem; border-radius: 6px; border: 1px dashed #ccc;">
                            <label style="font-size: 0.85rem; font-weight: bold;">Cupón Activo:</label>
                            <p style="margin: 0.2rem 0; color: #27ae60; font-weight: bold;">${savedDiscountPct > 0 ? `Descuento del ${savedDiscountPct}% aplicado` : 'Ninguno (Puedes aplicar en Campañas)'}</p>
                        </div>
                    </div>

                    <!-- RESUMEN Y BOTÓN DE CONFIRMAR -->
                    <div style="background: #f9f9f9; padding: 1.5rem; border-radius: 8px; width: 340px; border: 1px solid #ddd;">
                        <h3>Resumen del Pedido</h3>
                        <div style="margin: 1rem 0; font-size: 0.95rem; line-height: 1.8;">
                            <div style="display: flex; justify-content: space-between;">
                                <span>Subtotal:</span>
                                <strong>$${subtotal.toLocaleString()} MXN</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; color: #27ae60;">
                                <span>Descuento (${savedDiscountPct}%):</span>
                                <strong>-$${discountAmount.toLocaleString()} MXN</strong>
                            </div>
                            <hr style="margin: 0.5rem 0; border: none; border-top: 1px solid #ddd;">
                            <div style="display: flex; justify-content: space-between; font-size: 1.25rem; color: #e67e22;">
                                <span>Total a pagar:</span>
                                <strong>$${finalTotal.toLocaleString()} MXN</strong>
                            </div>
                        </div>
                        <button onclick="processCheckout(${finalTotal})" class="btn-primary" style="width: 100%; cursor: pointer; padding: 0.75rem; font-size: 1rem; font-weight: bold;">Confirmar Pago y Facturar</button>
                    </div>
                </div>
            `;
            togglePaymentFields('card');
        }

        function togglePaymentFields(type) {
            const fields = document.getElementById('paymentFormFields');
            if (type === 'card') {
                fields.innerHTML = `
                    <div style="margin-bottom: 0.75rem;"><label style="font-size:0.8rem; font-weight:bold;">Número de Tarjeta</label><input type="text" placeholder="4532 •••• •••• 8921" style="width:100%; padding:0.4rem; border:1px solid #ccc; border-radius:4px;"></div>
                    <div style="display:flex; gap:0.5rem;">
                        <div><label style="font-size:0.8rem; font-weight:bold;">Exp.</label><input type="text" placeholder="MM/AA" style="width:100%; padding:0.4rem; border:1px solid #ccc; border-radius:4px;"></div>
                        <div><label style="font-size:0.8rem; font-weight:bold;">CVV</label><input type="password" placeholder="123" style="width:100%; padding:0.4rem; border:1px solid #ccc; border-radius:4px;"></div>
                    </div>
                `;
            } else if (type === 'paypal') {
                fields.innerHTML = `
                    <div style="margin-bottom: 0.5rem;"><label style="font-size:0.8rem; font-weight:bold;">Correo Electrónico PayPal</label><input type="email" placeholder="usuario@paypal.com" style="width:100%; padding:0.4rem; border:1px solid #ccc; border-radius:4px;"></div>
                `;
            } else {
                fields.innerHTML = `
                    <p style="font-size: 0.85rem; color: #555; margin:0;">Se generará una referencia numérica de pago en efectivo para OXXO Pay con vigencia de 24 horas.</p>
                `;
            }
        }

        function processCheckout(totalPaid) {
            const cart = JSON.parse(localStorage.getItem('strydr_cart')) || [];
            if (cart.length === 0) return;

            const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            const ticketId = 'STRYDR-FAC-' + Math.floor(100000 + Math.random() * 900000);
            const now = new Date().toLocaleString();

            const newTicket = {
                id: ticketId,
                date: now,
                items: cart,
                total: totalPaid,
                method: selectedMethod
            };

            // Guardar en historial de compras del usuario
            let userPurchases = JSON.parse(localStorage.getItem('strydr_purchases')) || [];
            userPurchases.unshift(newTicket);
            localStorage.setItem('strydr_purchases', JSON.stringify(userPurchases));

            // Limpiar carrito y descuento activo
            localStorage.removeItem('strydr_cart');
            localStorage.removeItem('strydr_discount');

            // Renderizar el Ticket en pantalla (Factura digital)
            renderTicketScreen(newTicket);
        }

        function renderTicketScreen(ticket) {
            const container = document.getElementById('checkoutContainer');

            let itemsHtml = ticket.items.map(i => `
                <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem; font-size:0.9rem;">
                    <span>${i.quantity}x ${i.name}</span>
                    <span>$${(i.price * i.quantity).toLocaleString()} MXN</span>
                </div>
            `).join('');

            container.innerHTML = `
                <div style="max-width: 600px; margin: 0 auto; background: white; border: 2px solid #333; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
                    <div style="text-align: center; border-bottom: 2px dashed #ccc; padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
                        <h2 style="margin:0; font-size:1.8rem;">STRYDR INC.</h2>
                        <p style="margin:0.2rem 0; color:#666; font-size:0.85rem;">Comprobante Fiscal Digital / Ticket de Compra</p>
                        <strong style="color: #e67e22; font-size: 1.1rem; display:block; margin-top:0.5rem;">Folio: ${ticket.id}</strong>
                    </div>

                    <div style="margin-bottom: 1.5rem; font-size: 0.9rem; color: #444;">
                        <p style="margin:0.2rem 0;"><strong>Fecha y Hora:</strong> ${ticket.date}</p>
                        <p style="margin:0.2rem 0;"><strong>Método de Pago:</strong> ${ticket.method}</p>
                        <p style="margin:0.2rem 0;"><strong>Estado:</strong> Pagado con Éxito ✔</p>
                    </div>

                    <div style="border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 1rem 0; margin-bottom: 1.5rem;">
                        <h4 style="margin:0 0 0.5rem 0;">Detalle de Productos:</h4>
                        ${itemsHtml}
                    </div>

                    <div style="display:flex; justify-content:space-between; font-size:1.2rem; font-weight:bold; color:#e67e22; margin-bottom: 2rem;">
                        <span>Total Pagado:</span>
                        <span>$${ticket.total.toLocaleString()} MXN</span>
                    </div>

                    <div style="display: flex; gap: 1rem; justify-content: center;">
                        <button onclick="downloadTicketFile('${ticket.id}', '${ticket.date}', ${ticket.total}, '${ticket.method}')" class="btn-primary" style="cursor: pointer; padding: 0.7rem 1.5rem; font-weight: bold;">📥 Descargar Factura (TXT)</button>
                        <a href="perfil.html" class="btn-secondary" style="text-decoration:none; padding: 0.7rem 1.5rem; background:#7f8c8d; color:white; border-radius:6px; font-weight:bold;">Ver en Mis Compras (Perfil)</a>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Función para descargar el ticket como archivo sin abrir ventanas nuevas
        function downloadTicketFile(id, date, total, method) {
            const textContent = `========================================\n           STRYDR INC. - FACTURA\n========================================\nFolio: ${id}\nFecha: ${date}\nMétodo: ${method}\nTotal Pagado: $${total.toLocaleString()} MXN\n========================================\n¡Gracias por tu compra en Strydr!`;

            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${id}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function updateQuantity(index, newQty) {
            let cart = JSON.parse(localStorage.getItem('strydr_cart')) || [];
            const parsedQty = parseInt(newQty);
            if (parsedQty > 0) {
                cart[index].quantity = parsedQty;
                localStorage.setItem('strydr_cart', JSON.stringify(cart));
                renderCheckout();
            }
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('strydr_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('strydr_cart', JSON.stringify(cart));
            renderCheckout();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCheckout();

            const session = JSON.parse(localStorage.getItem('strydr_session'));
            const adminLink = document.getElementById('adminNavLink');
            const profileLink = document.getElementById('profileNavLink');

            if (session && session.isLoggedIn && session.role === 'Admin') {
                if (adminLink) adminLink.style.display = 'inline-block';
            } else {
                if (adminLink) adminLink.style.display = 'none';
                if (!session || !session.isLoggedIn) {
                    if (profileLink) {
                        profileLink.textContent = "Iniciar Sesión";
                        profileLink.href = "login.html";
                    }
                }
            }
        });
    </script>
</body>

</html>
