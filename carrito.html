<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strydr | Carrito</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>


    <header class="navbar">
        <div class="logo">STRYDR<span>.</span></div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="campana.html">Campañas & Promos</a>
            <a href="publicar.html">Vender (C2C)</a>
            <a href="subasta.html">Subasta</a>
            <a href="carrito.html" class="active">Carrito <span class="cart-badge" id="cartCount">0</span></a>
            <a href="perfil.html" class="btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Mi
                Perfil</a>
            <a href="admin.html" style="font-size: 0.85rem; opacity: 0.8;">Admin</a>
        </nav>
    </header>

    <main class="container">
        <section class="page-header">
            <h2>Carrito de Compras</h2>
            <p class="subtitle">Ajusta las cantidades, aplica tus cupones de descuento y finaliza tu pedido.</p>
        </section>

        <div id="cartContent"></div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Strydr Inc. Todos los derechos reservados.</p>
    </footer>

    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('strydr_cart')) || [];
            const container = document.getElementById('cartContent');
            const cartCountBadge = document.getElementById('cartCount');

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (cartCountBadge) cartCountBadge.textContent = totalItems;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 3rem 1rem;">
                        <p style="font-size: 1.2rem; color: #666;">Tu carrito está vacío.</p>
                        <a href="catalogo.html" class="btn-primary" style="display: inline-block; margin-top: 1rem; text-decoration: none;">Explorar Catálogo</a>
                    </div>
                `;
                return;
            }

            let subtotal = 0;
            let rowsHtml = cart.map((item, index) => {
                const itemSubtotal = item.price * item.quantity;
                subtotal += itemSubtotal;
                return `
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 1rem;"><strong>${item.name}</strong><br><small style="color:#777;">${item.category}</small></td>
                        <td style="padding: 1rem;">$${item.price.toLocaleString()} MXN</td>
                        <td style="padding: 1rem;">
                            <input type="number" value="${item.quantity}" min="1" max="10" onchange="updateQuantity(${index}, this.value)" style="width: 60px; padding: 0.3rem; border: 1px solid #ccc; border-radius: 4px;">
                        </td>
                        <td style="padding: 1rem;">$${itemSubtotal.toLocaleString()} MXN</td>
                        <td style="padding: 1rem;">
                            <button onclick="removeItem(${index})" style="background: none; border: none; color: #e74c3c; cursor: pointer; font-weight: bold;">Eliminar</button>
                        </td>
                    </tr>
                `;
            }).join('');

            // Leer porcentaje guardado desde Campañas o Carrito
            const savedDiscountPct = parseFloat(localStorage.getItem('strydr_discount')) || 0;
            const discountAmount = (subtotal * savedDiscountPct) / 100;
            const finalTotal = Math.max(0, subtotal - discountAmount);

            container.innerHTML = `
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 2rem;">
                        <thead>
                            <tr style="border-bottom: 2px solid #ddd; text-align: left;">
                                <th style="padding: 0.75rem;">Producto</th>
                                <th style="padding: 0.75rem;">Precio</th>
                                <th style="padding: 0.75rem;">Cantidad</th>
                                <th style="padding: 0.75rem;">Subtotal</th>
                                <th style="padding: 0.75rem;">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>

                <div style="display: flex; gap: 2rem; flex-wrap: wrap; justify-content: space-between; align-items: flex-start;">
                    <!-- MÓDULO DE CUPÓN -->
                    <div style="background: #f9f9f9; padding: 1.5rem; border-radius: 8px; flex: 1; min-width: 280px;">
                        <h3>🏷 ¿Tienes un Cupón de Descuento?</h3>
                        <p style="font-size: 0.85rem; color: #666; margin-bottom: 1rem;">Ingresa tu código promocional (ej. STRYDR10 o 2X1SPECIAL):</p>
                        <form id="cartCouponForm" novalidate style="display: flex; gap: 0.5rem;">
                            <input type="text" id="cartCouponInput" placeholder="Ej. STRYDR10" style="flex: 1; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; text-transform: uppercase;">
                            <button type="submit" class="btn-primary" style="cursor: pointer;">Aplicar</button>
                        </form>
                        <div id="cartCouponMsg" class="alert success" style="display: ${savedDiscountPct > 0 ? 'block' : 'none'}; margin-top: 1rem; background: #2ecc71; color: white; padding: 0.6rem; border-radius: 4px; font-size: 0.85rem;">
                            Descuento aplicado (simulado)
                        </div>
                    </div>

                    <!-- RESUMEN CON MONTO DESCONTADO REAL -->
                    <div style="background: #f9f9f9; padding: 1.5rem; border-radius: 8px; width: 340px;">
                        <h3>Resumen del Pedido</h3>
                        <div style="margin: 1rem 0; font-size: 0.95rem; line-height: 1.8;">
                            <div style="display: flex; justify-content: space-between;">
                                <span>Subtotal:</span>
                                <strong>$${subtotal.toLocaleString()} MXN</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; color: #27ae60;">
                                <span>Descuento (${savedDiscountPct}%):</span>
                                <strong>-$${discountAmount.toLocaleString()} MXN</strong>
                            </div>
                            <hr style="margin: 0.5rem 0; border: none; border-top: 1px solid #ddd;">
                            <div style="display: flex; justify-content: space-between; font-size: 1.25rem; color: #e67e22;">
                                <span>Total a pagar:</span>
                                <strong>$${finalTotal.toLocaleString()} MXN</strong>
                            </div>
                        </div>
                        <button onclick="simulateCheckout()" class="btn-primary w-full" style="width: 100%; cursor: pointer;">Simular Compra</button>
                        <div id="checkoutNotice" class="alert success" style="display: none; margin-top: 1rem; background: #2ecc71; color: white; padding: 0.75rem; border-radius: 4px;">
                            ¡Compra realizada con éxito! Redirigiendo a tu perfil...
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('cartCouponForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const input = document.getElementById('cartCouponInput');
                const code = input ? input.value.trim().toUpperCase() : '';

                if (code === 'STRYDR10') {
                    localStorage.setItem('strydr_discount', '10');
                } else if (code === '2X1SPECIAL') {
                    localStorage.setItem('strydr_discount', '50');
                } else {
                    localStorage.setItem('strydr_discount', '15');
                }
                renderCart();
            });
        }

        function updateQuantity(index, newQty) {
            let cart = JSON.parse(localStorage.getItem('strydr_cart')) || [];
            const parsedQty = parseInt(newQty);
            if (parsedQty > 0) {
                cart[index].quantity = parsedQty;
                localStorage.setItem('strydr_cart', JSON.stringify(cart));
                renderCart();
            }
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('strydr_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('strydr_cart', JSON.stringify(cart));
            renderCart();
        }

        function simulateCheckout() {
            document.getElementById('checkoutNotice').style.display = 'block';
            localStorage.removeItem('strydr_cart');
            localStorage.removeItem('strydr_discount');
            setTimeout(() => {
                window.location.href = 'perfil.html';
            }, 1200);
        }

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>

</html>
