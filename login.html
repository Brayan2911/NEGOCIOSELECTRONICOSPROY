<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strydr | Iniciar Sesión</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">STRYDR<span>.</span></div>
        <nav class="nav-links" id="navLinksContainer">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="campana.html">Campañas & Promos</a>
            <a href="publicar.html">Vender (C2C)</a>
            <a href="subasta.html">Subasta</a>
            <a href="carrito.html">Carrito <span class="cart-badge" id="cartCount">0</span></a>
            <a href="login.html" class="active btn-secondary"
                style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Iniciar Sesión</a>
        </nav>
    </header>

    <main class="container">
        <div class="auth-card"
            style="max-width: 400px; margin: 2rem auto; background: #f9f9f9; padding: 2rem; border-radius: 8px;">
            <section class="page-header" style="margin-bottom: 1.5rem; text-align: center;">
                <h2>Iniciar Sesión</h2>
                <p class="subtitle">Accede a tu cuenta de usuario o panel administrador.</p>
            </section>

            <form id="loginForm" novalidate>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.25rem;">Correo electrónico</label>
                    <input type="email" id="l-email" placeholder="admin@strydr.com o tu@correo.com"
                        style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.25rem;">Contraseña</label>
                    <input type="password" id="l-pass" placeholder="••••••••"
                        style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <button type="submit" class="btn-primary w-full"
                    style="width: 100%; padding: 0.6rem; cursor: pointer;">Ingresar</button>
            </form>

            <div id="loginStatus" class="alert success"
                style="display: none; margin-top: 1rem; background: #2ecc71; color: white; padding: 0.75rem; border-radius: 4px; text-align: center;">
                ¡Sesión iniciada con éxito! Redirigiendo...
            </div>

            <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </main>

    <footer class="footer" style="margin-top: 4rem;">
        <p>&copy; 2026 Strydr Inc. Todos los derechos reservados.</p>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('l-email').value.trim().toLowerCase();

            let userSession = {
                name: "Brayan Camarillo",
                email: email || "brayan@strydr.com",
                role: "User",
                isLoggedIn: true
            };

            // Detectar si ingresa como Admin
            if (email.includes('admin')) {
                userSession.name = "Administrador Strydr";
                userSession.role = "Admin";
            }

            localStorage.setItem('strydr_session', JSON.stringify(userSession));

            const statusMsg = document.getElementById('loginStatus');
            statusMsg.style.display = 'block';

            setTimeout(() => {
                if (userSession.role === "Admin") {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'perfil.html';
                }
            }, 1000);
        });

        document.addEventListener('DOMContentLoaded', () => {
            const cart = JSON.parse(localStorage.getItem('strydr_cart')) || [];
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cartCount');
            if (badge) badge.textContent = totalItems;
        });
    </script>
</body>

</html>
