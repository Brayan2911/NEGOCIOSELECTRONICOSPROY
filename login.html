<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strydr | Iniciar Sesión</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">STRYDR<span>.</span></div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="carrito.html">Carrito <span class="cart-badge" id="cartCount">2</span></a>
            <a href="perfil.html" class="btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Mi
                Perfil</a>
            <a href="admin.html" style="font-size: 0.85rem; opacity: 0.8;">Admin</a>
        </nav>
    </header>

    <main class="container">
        <div class="form-container" style="max-width: 400px; margin: 3rem auto;">
            <section class="page-header" style="margin-bottom: 1.5rem;">
                <h2>Iniciar Sesión</h2>
                <p class="subtitle">Ingresa a tu cuenta de Strydr.</p>
            </section>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="loginEmail" placeholder="tu@correo.com" value="brayan@strydr.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPass" value="123456" required>
                </div>
                <button type="submit" class="btn-primary w-full">Entrar</button>
            </form>

            <div id="loginNotice" class="alert success" style="margin-top: 1rem; display: none;">
                ¡Sesión iniciada correctamente! Redirigiendo a tu perfil...
            </div>

            <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Strydr Inc. Todos los derechos reservados.</p>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            // Guardar el estado de la sesión activa
            localStorage.setItem('isLoggedIn', 'true');

            const notice = document.getElementById('loginNotice');
            notice.style.display = 'block';

            setTimeout(() => {
                window.location.href = 'perfil.html';
            }, 800);
        });


        document.addEventListener('DOMContentLoaded', () => {
            // Consultar si la sesión existe en cualquiera de los dos almacenamientos
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true' || sessionStorage.getItem('isLoggedIn') === 'true';
            const navAuth = document.getElementById('navAuth');

            if (isLoggedIn && navAuth) {
                navAuth.innerHTML = `
                <a href="perfil.html" class="btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Mi Perfil</a>
                <a href="admin.html" style="font-size: 0.85rem; opacity: 0.8; margin-left: 0.5rem;">Admin</a>
            `;
            }
        });

    </script>
</body>

</html>
