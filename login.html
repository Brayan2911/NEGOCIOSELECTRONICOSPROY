<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strydr | Iniciar Sesión</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">STRYDR<span>.</span></div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="campana.html">Campañas & Promos</a>
            <a href="publicar.html">Vender (C2C)</a>
            <a href="subasta.html">Subasta</a>
            <a href="carrito.html">Carrito <span class="cart-badge" id="cartCount">0</span></a>
            <a href="perfil.html" class="btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Mi
                Perfil</a>
            <a href="admin.html" style="font-size: 0.85rem; opacity: 0.8;">Admin</a>
        </nav>
    </header>

    <main class="container">
        <div class="form-container" style="max-width: 400px; margin: 3rem auto;">
            <section class="page-header" style="margin-bottom: 1.5rem;">
                <h2>Iniciar Sesión</h2>
                <p class="subtitle">Ingresa a tu cuenta de Strydr.</p>
            </section>

            <form id="loginForm">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Correo Electrónico</label>
                    <input type="email" id="loginEmail" placeholder="tu@correo.com" value="brayan@strydr.com" required
                        style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Contraseña</label>
                    <input type="password" id="loginPass" value="123456" required
                        style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <button type="submit" class="btn-primary w-full" style="width: 100%; cursor: pointer;">Entrar</button>
            </form>

            <div id="loginNotice" class="alert success"
                style="margin-top: 1rem; display: none; background: #2ecc71; color: white; padding: 0.75rem; border-radius: 4px;">
                ¡Sesión iniciada correctamente (Simulado)! Redirigiendo a tu perfil...
            </div>

            <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Strydr Inc. Todos los derechos reservados.</p>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            localStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('isLoggedIn', 'true');

            document.getElementById('loginNotice').style.display = 'block';

            setTimeout(() => {
                window.location.href = 'perfil.html';
            }, 800);
        });

        document.addEventListener('DOMContentLoaded', () => {
            const cart = JSON.parse(localStorage.getItem('strydr_cart')) || [];
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cartCount');
            if (badge) badge.textContent = totalItems;
        });
    </script>
</body>

</html>
